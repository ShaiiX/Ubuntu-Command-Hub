<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
      content="Ubuntu Command Hub — Interactive cheatsheet for Linux commands. Bilingual ES/EN." />
    <meta name="theme-color" content="#0d1117" />
    <title>Command Hub — Ubuntu Linux</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="app">
      <header class="header">
        <div class="header-left">
          <button id="menu-btn" class="menu-btn" aria-label="Toggle menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <div class="logo">
            <div class="logo-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="4 17 10 11 4 5" />
                <line x1="12" y1="19" x2="20" y2="19" />
              </svg>
            </div>
            <span class="logo-text"><span>U</span>buntu Command Hub</span>
          </div>
        </div>
        <div class="header-right">
          <button id="lang-toggle" class="lang-toggle"
            aria-label="Toggle language">
            <span class="lang-dot"></span>
            <span class="lang-label">ES</span>
          </button>
        </div>
      </header>

      <div class="layout">
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <aside id="sidebar" class="sidebar">
          <nav class="sidebar-nav" role="navigation" aria-label="Categories">
          </nav>
        </aside>

        <main class="main">
          <div id="search-container" class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" class="search-input"
              placeholder="Buscar comandos..." autocomplete="off"
              spellcheck="false" />
            <button class="search-clear">Limpiar</button>
          </div>

          <div id="commands-container" class="commands-container">
          </div>
        </main>
      </div>
    </div>

  </body>

</html>
